name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: Version to release, without a v (for example 0.3.0)
                required: true
                type: string
            prerelease:
                description: Mark the release as a pre-release
                required: false
                type: boolean
                default: false

permissions:
    contents: write
    pull-requests: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        name: Release ${{ inputs.version }}
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token }}
            VERSION: ${{ inputs.version }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: main
                  fetch-depth: 0

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Check the version
              id: previous
              run: |
                  if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::$VERSION is not a version like 1.2.3"
                      exit 1
                  fi
                  if git rev-parse --quiet --verify "refs/tags/$VERSION" > /dev/null; then
                      echo "::error::Tag $VERSION already exists"
                      exit 1
                  fi
                  previous=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
                  if [ -n "$previous" ] && [ "$(printf '%s\n%s\n' "$previous" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
                      echo "::error::$VERSION is not higher than the last release $previous"
                      exit 1
                  fi
                  echo "tag=$previous" >> "$GITHUB_OUTPUT"

            - name: Collect the pull requests merged since the last release
              env:
                  PREVIOUS: ${{ steps.previous.outputs.tag }}
              run: |
                  # In UTC, like GitHub's mergedAt, so the two compare correctly as text.
                  since=$(TZ=UTC git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd "$PREVIOUS" 2> /dev/null || echo 1970-01-01T00:00:00Z)
                  gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base main --limit 500 \
                      --json title,url,mergedAt \
                      --jq "[.[] | select(.mergedAt > \"$since\")] | sort_by(.mergedAt) | .[] | \"- [\(.title)](\(.url))\"" \
                      > "$RUNNER_TEMP/pull-requests.md"
                  if [ ! -s "$RUNNER_TEMP/pull-requests.md" ]; then
                      echo "::error::No pull requests were merged into main since ${PREVIOUS:-the first commit}, so there is nothing to release"
                      exit 1
                  fi
                  {
                      echo '## Updates'
                      cat "$RUNNER_TEMP/pull-requests.md"
                      echo
                      if [ -n "$PREVIOUS" ]; then
                          echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS...$VERSION"
                      else
                          echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/commits/$VERSION"
                      fi
                  } > "$RUNNER_TEMP/notes.md"
                  cat "$RUNNER_TEMP/notes.md"

            - name: Set the version
              run: |
                  npm version "$VERSION" --no-git-tag-version
                  node -e '
                      const { readFileSync, writeFileSync } = require("node:fs");
                      const manifest = JSON.parse(readFileSync("src/manifest.json", "utf8"));
                      manifest.version = process.env.VERSION;
                      writeFileSync("src/manifest.json", `${JSON.stringify(manifest, null, 4)}\n`);
                  '

            - run: npm ci

            - run: npm run build

            - run: npm run lint

            - name: Sign the Firefox build
              env:
                  WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
                  WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
              run: npm run sign:firefox

            - name: Commit the version
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add package.json package-lock.json src/manifest.json
                  git commit -m "Bumped the version to $VERSION" -m "Released with the pull requests merged since the last release."
                  git push origin HEAD:main
                  echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

            - name: Create the release
              env:
                  PRERELEASE: ${{ inputs.prerelease }}
              run: |
                  flags=()
                  if [ "$PRERELEASE" = 'true' ]; then
                      flags+=(--prerelease)
                  fi
                  gh release create "$VERSION" \
                      "dist/phpmyadmin-tools-firefox-$VERSION.xpi" \
                      "dist/phpmyadmin-tools-chrome-$VERSION.zip" \
                      "dist/phpmyadmin-tools-firefox-$VERSION.zip" \
                      --target "$SHA" \
                      --title "$VERSION" \
                      --notes-file "$RUNNER_TEMP/notes.md" \
                      "${flags[@]}"
