name: Test

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: test-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Syntax, build and lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - name: Check the JavaScript syntax
              run: for file in src/*.js scripts/*.mjs; do node --check "$file"; done

            - run: npm run build

            - name: Lint the Firefox build
              run: npm run lint
