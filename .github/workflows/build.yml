name: Build

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: Build the Chrome and Firefox packages
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - run: npm run build

            # Only for testing: Firefox installs come from addons.mozilla.org, which the release workflow submits to.
            - uses: actions/upload-artifact@v7
              with:
                  name: phpmyadmin-tools-${{ github.sha }}
                  path: dist/*.zip
                  if-no-files-found: error
                  retention-days: 30
